<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>KΛLT | Coin Converter</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#252525 0%,#0b0b0b 55%,#000 100%);color:#eee;font-family:Arial,sans-serif;padding:20px}
.panel{width:100%;max-width:440px;padding:32px;background:rgba(17,17,17,.94);border:1px solid #393939;border-radius:18px;box-shadow:0 20px 70px #000}
.brand{text-align:center;font-size:36px;font-weight:900;letter-spacing:7px}
.subtitle{text-align:center;color:#888;font-size:11px;letter-spacing:4px;margin:9px 0 30px}
.line{height:1px;background:#333;margin-bottom:26px}
label{display:block;color:#aaa;font-size:12px;margin:18px 0 9px}
input{width:100%;padding:15px;background:#080808;border:1px solid #383838;border-radius:9px;color:white;font-size:19px;outline:none}
input:focus{border-color:#aaa}
.result{margin-top:22px;padding:22px 15px;text-align:center;background:linear-gradient(135deg,#202020,#0b0b0b);border:1px solid #484848;border-radius:12px}
.result small{color:#999;letter-spacing:2px}
.amount{font-size:34px;font-weight:800;margin:12px 0;overflow-wrap:anywhere}
.unit{font-size:13px;color:#bbb;letter-spacing:3px}
button{width:100%;padding:14px;margin-top:14px;border:1px solid #666;border-radius:9px;background:#eee;color:#080808;font-weight:bold;cursor:pointer;font-size:14px;transition:.2s}
button:hover{background:#c7c7c7;transform:translateY(-1px)}
.secondary{background:#171717;color:#eee;border-color:#383838}
.info{font-size:12px;color:#777;text-align:center;line-height:1.8;margin-top:22px}
footer{text-align:center;color:#555;font-size:10px;letter-spacing:2px;margin-top:25px}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">KΛLT</div>
  <div class="subtitle">COIN CONVERTER</div>
  <div class="line"></div>
  <label for="coins">DEINE MÜNZEN</label>
  <input id="coins" type="number" min="0" step="any" placeholder="z. B. 1000000">
  <div class="result">
    <small>DEIN GUTHABEN</small>
    <div class="amount" id="result">0</div>
    <div class="unit">KΛLT</div>
  </div>
  <button id="copy">ERGEBNIS KOPIEREN</button>
  <label for="kalt">KΛLT IN MÜNZEN UMRECHNEN</label>
  <input id="kalt" type="number" min="0" step="any" placeholder="z. B. 10000">
  <button class="secondary" id="reset">ZURÜCKSETZEN</button>
  <div class="info">100 Münzen = 1 KΛLT<br>10.000 KΛLT = 1.000.000 Münzen</div>
  <footer>KΛLT SYSTEMS · COIN EXCHANGE</footer>
</main>
<script>
const coins = document.getElementById("coins");
const kalt = document.getElementById("kalt");
const result = document.getElementById("result");
const format = n => n.toLocaleString("de-DE", {maximumFractionDigits: 4});
coins.addEventListener("input", () => {
  if (coins.value === "") { kalt.value = ""; result.textContent = "0"; return; }
  const value = Number(coins.value);
  kalt.value = value / 100;
  result.textContent = format(value / 100);
});
kalt.addEventListener("input", () => {
  if (kalt.value === "") { coins.value = ""; result.textContent = "0"; return; }
  const value = Number(kalt.value);
  coins.value = value * 100;
  result.textContent = format(value);
});
document.getElementById("copy").addEventListener("click", async () => {
  const text = result.textContent + " KΛLT";
  try { await navigator.clipboard.writeText(text); alert("KΛLT-Ergebnis kopiert!"); }
  catch { window.prompt("Kopiere dein Ergebnis:", text); }
});
document.getElementById("reset").addEventListener("click", () => {
  coins.value = ""; kalt.value = ""; result.textContent = "0";
});
</script>
</body>
</html>
